services:
  aversa:
    image: ghcr.io/ardianryan/aversa44:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      NODE_ENV: production
      PORT: "4400"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set the public HTTPS origin}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?Set the actual proxy peer IP}
      TURNSTILE_ENABLED: "1"
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set the site key}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set the secret key}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aversa44
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
      PGDATABASE: aversa44_db
      SESSION_SECRET: ${SESSION_SECRET:?Set a session secret}
      TICKET_HMAC_SECRET: ${TICKET_HMAC_SECRET:?Set a ticket secret}
      CLOUD_STREAM_ENCRYPTION_KEY: ${CLOUD_STREAM_ENCRYPTION_KEY:?Set a 64-character hexadecimal encryption key}
      CLOUD_STREAM_DATA_DIR: /cloud-data
      CLOUD_STREAM_TAILSCALE_IP: ${CLOUD_STREAM_TAILSCALE_IP:?Set the VPS Tailscale IPv4 address}
      CLOUD_STREAM_INGEST_USER: ${CLOUD_STREAM_INGEST_USER:?Set the OBS ingest username}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator AVERSA}
      QBIZ_ENABLED: ${QBIZ_ENABLED:-0}
      QBIZ_BASE_URL: ${QBIZ_BASE_URL:-}
      QBIZ_API_KEY: ${QBIZ_API_KEY:-}
      QBIZ_MERCHANT_ID: ${QBIZ_MERCHANT_ID:-}
      QBIZ_WEBHOOK_SECRET: ${QBIZ_WEBHOOK_SECRET:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
      WHATSAPP_BOT_PHONE: ${WHATSAPP_BOT_PHONE:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      GOWA_SESSION_ID: ${GOWA_SESSION_ID:-}
      GOWA_BASE_URL: ${GOWA_BASE_URL:-}
      GOWA_USERNAME: ${GOWA_USERNAME:-}
      GOWA_PASSWORD: ${GOWA_PASSWORD:-}
      GOWA_ALLOW_TAILNET_HTTP: ${GOWA_ALLOW_TAILNET_HTTP:-0}
    volumes:
      - aversa_uploads:/app/public/uploads
      - aversa_stream_data:/cloud-data
    depends_on:
      postgres:
        condition: service_healthy
  cloud-stream:
    image: ghcr.io/ardianryan/aversa44-stream:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CLOUD_STREAM_TAILSCALE_IP:?Set the VPS Tailscale IPv4 address}:1935:1935/tcp"
      - "${CLOUD_STREAM_TAILSCALE_IP:?Set the VPS Tailscale IPv4 address}:8890:8890/udp"
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aversa44
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
      PGDATABASE: aversa44_db
      CLOUD_STREAM_ENCRYPTION_KEY: ${CLOUD_STREAM_ENCRYPTION_KEY:?Set a 64-character hexadecimal encryption key}
      CLOUD_STREAM_INGEST_USER: ${CLOUD_STREAM_INGEST_USER:?Set the OBS ingest username}
      CLOUD_STREAM_INGEST_PASSWORD: ${CLOUD_STREAM_INGEST_PASSWORD:?Set a random OBS ingest password}
      CLOUD_STREAM_RESOLUTION: ${CLOUD_STREAM_RESOLUTION:-720p}
      CLOUD_STREAM_DATA_DIR: /data
    volumes:
      - aversa_stream_data:/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: aversa44
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
      POSTGRES_DB: aversa44_db
    volumes:
      - aversa_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aversa44 -d aversa44_db"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  aversa_postgres:
  aversa_uploads:
  aversa_stream_data:
